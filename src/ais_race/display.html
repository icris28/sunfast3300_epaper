<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Fast 3300 · E1001 virtuel</title>
<style>
  body { margin: 0; background: #d8d8d4; color: #111; font: 15px Arial, sans-serif; }
  main { max-width: 820px; margin: 24px auto; padding: 0 10px; }
  h1 { font-size: 19px; margin: 0 0 12px; }
  canvas { display: block; width: 800px; height: 480px; max-width: 100%;
    background: #fafaf6; box-shadow: 0 6px 25px #777; image-rendering: auto; }
  p { line-height: 1.4; }
</style>
<main>
  <h1>Sun Fast 3300 · reTerminal E1001 virtuel</h1>
  <canvas id="screen" width="800" height="480" aria-label="Afficheur AIS 800 par 480 pixels"></canvas>
  <p>Flèches gauche/droite : vues · Entrée ou espace : cible suivante · Cliquer les trois boutons en bas de l'écran.</p>
</main>
<script>
"use strict";
const canvas = document.getElementById("screen"), c = canvas.getContext("2d");
const pages = ["CARTE", "TABLEAU", "GRAPHIQUES", "DETAIL"];
let page = 0, selected = 0, data = null, selectedMmsi = null;
const ink = "#111", pale = "#fafaf6", muted = "#777";
function line(x1,y1,x2,y2,width=1,color=ink,dash=[]) {
  c.beginPath(); c.lineWidth=width; c.strokeStyle=color; c.setLineDash(dash);
  c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.setLineDash([]);
}
function text(x,y,value,size=15,bold=false,align="left",color=ink) {
  c.font = (bold ? "bold " : "") + size + "px Consolas, monospace";
  c.textAlign=align; c.textBaseline="top"; c.fillStyle=color; c.fillText(value,x,y);
}
function circle(x,y,r,filled=false) {
  c.beginPath(); c.arc(x,y,r,0,2*Math.PI);
  c.fillStyle=filled?ink:pale; c.strokeStyle=ink; c.lineWidth=2;
  c.fill(); c.stroke();
}
function frame() {
  c.fillStyle=pale; c.fillRect(0,0,800,480);
  text(18,13,"AIS RACE  /  SUN FAST 3300",20,true);
  text(782,17,pages[page],17,true,"right");
  line(18,49,782,49,2); line(18,430,782,430,2);
  text(52,446,"<  PAGE",15,true);
  text(400,446,"O  CIBLE",15,true,"center");
  text(748,446,"PAGE  >",15,true,"right");
  line(265,438,265,471); line(535,438,535,471);
}
function target() { return data?.targets?.[selected]; }
function map() {
  const cx=335,cy=242,scale=125,own=data.own;
  for (const nm of [.5,1,1.5]) {
    c.beginPath(); c.arc(cx,cy,nm*scale,0,2*Math.PI);
    c.strokeStyle="#bbb"; c.setLineDash([3,5]); c.stroke(); c.setLineDash([]);
    text(cx+nm*scale+3,cy,String(nm),10,false,"left",muted);
  }
  line(cx,68,cx,417,1,"#bbb",[2,6]); line(45,cy,618,cy,1,"#bbb",[2,6]);
  c.fillStyle=ink; c.beginPath(); c.moveTo(cx,cy-12); c.lineTo(cx-10,cy+10);
  c.lineTo(cx+10,cy+10); c.fill(); text(cx+13,cy+10,"NOUS",12,true);
  data.targets.forEach((t,i)=>{
    const north=(t.lat-own.lat)*Math.PI/180*3440.065;
    const east=(t.lon-own.lon)*Math.PI/180*3440.065*Math.cos((t.lat+own.lat)*Math.PI/360);
    const x=Math.max(55,Math.min(605,cx+east*scale)), y=Math.max(80,Math.min(405,cy-north*scale));
    circle(x,y,6,i===selected); text(x+10,y-13,t.name,12,i===selected);
  });
  line(635,65,635,419); const t=target(); if (!t) return;
  text(653,75,"CIBLE",13,true); text(653,103,t.name,15,true);
  text(653,145,t.distance_nm.toFixed(2)+" NM",23,true);
  text(653,185,t.bearing_deg.toFixed(0)+"° REL",16);
  text(653,225,t.sog_avg["120"].toFixed(1)+" kn",17);
  text(653,257,"SOG MOY 2 MIN",11);
  text(653,301,t.cog_avg["120"].toFixed(0)+"°",20);
  text(653,333,"COG MOY 2 MIN",11);
  text(653,380,"CPA "+t.cpa_nm.toFixed(2)+" NM",14,true);
}
function table() {
  text(27,65,"CONCURRENT",14,true);
  [[318,"DIST NM"],[430,"SOG 2'"],[536,"COG 2'"],[646,"GAIN 5'"]]
    .forEach(([x,s])=>text(x,65,s,14,true));
  line(20,92,780,92);
  data.targets.slice(0,7).forEach((t,i)=>{
    const y=105+i*47;
    if (i===selected) { c.strokeStyle=ink; c.lineWidth=2; c.strokeRect(20,y-3,760,40); }
    text(30,y+5,t.name.slice(0,19),17,i===selected);
    text(318,y+5,t.distance_nm.toFixed(2),17);
    text(430,y+5,t.sog_avg["120"].toFixed(1),17);
    text(536,y+5,t.cog_avg["120"].toFixed(0)+"°",17);
    text(646,y+5,(t.gain_m["300"]>=0?"+":"")+t.gain_m["300"].toFixed(0)+" m",17);
    line(20,y+42,780,y+42,1,"#bbb");
  });
  text(26,401,"Gain + : l'écart avec nous se réduit. Moyennes sur échantillons disponibles.",11);
}
function graph() {
  const t=target(); if (!t) return;
  text(27,65,t.name,20,true);
  text(770,69,"ECART "+t.distance_nm.toFixed(2)+" NM",16,true,"right");
  const x0=78,y0=130,w=660,h=230;
  line(x0,y0,x0,y0+h,2); line(x0,y0+h,x0+w,y0+h,2);
  const pts=t.history.filter(v=>v[0]>=data.timestamp-300);
  if (pts.length) {
    const vals=pts.map(v=>v[1]), min=Math.min(...vals), max=Math.max(...vals);
    const pad=Math.max(.05,(max-min)*.15),lo=min-pad,hi=max+pad;
    for (const f of [0,.5,1]) {
      const y=y0+h-f*h; line(x0,y,x0+w,y,1,"#bbb",[3,5]);
      text(70,y,(lo+f*(hi-lo)).toFixed(2),11,false,"right");
    }
    c.beginPath();
    pts.forEach(([time,gap],i)=>{
      const x=x0+w*(time-(data.timestamp-300))/300;
      const y=y0+h-(gap-lo)/(hi-lo)*h;
      if (i===0) c.moveTo(x,y); else c.lineTo(x,y);
    });
    c.strokeStyle=ink; c.lineWidth=3; c.stroke();
  }
  text(x0,374,"-5 MIN",12); text(x0+w,374,"MAINTENANT",12,false,"right");
  text(78,400,"Distance avec nous (NM) · courbe montante : le concurrent s'éloigne",12);
}
function detail() {
  const t=target(); if (!t) return;
  text(27,67,t.name,25,true); text(28,116,"MMSI  "+t.mmsi,13);
  line(390,105,390,408);
  const left=[
    ["DISTANCE",t.distance_nm.toFixed(2)+" NM"],
    ["RELEVEMENT",t.bearing_deg.toFixed(0)+"°"],
    ["SOG / COG",t.sog.toFixed(1)+" kn  /  "+t.cog.toFixed(0)+"°"],
    ["CPA / TCPA",t.cpa_nm.toFixed(2)+" NM  /  "+t.tcpa_min.toFixed(0)+" min"]
  ];
  left.forEach(([label,value],i)=>{const y=160+i*62;text(28,y,label,12);text(28,y+18,value,20,true);});
  const fmt=(field,unit,digits)=>[30,120,300].map(v=>t[field][String(v)].toFixed(digits)+unit).join(" / ");
  const right=[
    ["SOG 30s / 2m / 5m",fmt("sog_avg","",1)],
    ["COG 30s / 2m / 5m",fmt("cog_avg","°",0)],
    ["GAIN 30s / 2m / 5m",[30,120,300].map(v=>(t.gain_m[String(v)]>=0?"+":"")+t.gain_m[String(v)].toFixed(0)).join(" / ")+" m"]
  ];
  right.forEach(([label,value],i)=>{const y=160+i*82;text(416,y,label,12);text(416,y+22,value,18,true);});
  text(416,399,"GAIN + : écart réduit",12);
}
function draw() {
  frame();
  if (!data) {text(400,225,"EN ATTENTE DES DONNEES AIS",19,true,"center");return;}
  [map,table,graph,detail][page]();
}
function navigate(which) {
  if (which==="left") page=(page+3)%4;
  if (which==="right") page=(page+1)%4;
  if (which==="enter" && data?.targets?.length) selected=(selected+1)%data.targets.length;
  selectedMmsi=target()?.mmsi; draw();
}
canvas.addEventListener("click",e=>{
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*800/rect.width, y=(e.clientY-rect.top)*480/rect.height;
  if (y>=438) navigate(x<265?"left":x>535?"right":"enter");
});
document.addEventListener("keydown",e=>{
  const action={ArrowLeft:"left",ArrowRight:"right",Enter:"enter"," ":"enter",a:"left",d:"right",s:"enter"}[e.key];
  if (action) {e.preventDefault();navigate(action);}
});
async function refresh() {
  try {
    const response=await fetch("/snapshot",{cache:"no-store"});
    if (!response.ok) throw new Error("HTTP "+response.status);
    data=await response.json();
    selected=Math.max(0,data.targets.findIndex(t=>t.mmsi===selectedMmsi));
    selectedMmsi=target()?.mmsi; draw();
  } catch (error) {
    frame();text(400,225,"CONNEXION AU SIMULATEUR PERDUE",18,true,"center");
  }
}
draw(); refresh(); setInterval(refresh,1000);
</script>
</html>
