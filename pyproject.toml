[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunfast3300-epaper"
version = "0.2.0"
description = "AIS race display and 800x480 TRMNL / E1001 e-paper simulator"
requires-python = ">=3.10"

[project.scripts]
ais-race = "ais_race.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ais_race = ["display.html", "static/*.html", "static/*.css", "static/*.js"]
